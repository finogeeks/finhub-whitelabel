# White-label FinHub values overlay (stub)
# Merge with the chatkit chart from your offline release, e.g.:
#   helm upgrade --install chatkit deploy/k8s/helm/chatkit \
#     -f deploy/helm/values-whitelabel.yaml
#
# Example hostname (override per environment):
#   hub.example.com

servicesEnv:
  persona-service:
    PERSONA_TEMPLATE_CONFIG_PATH: /pack/persona-templates.json

personaTemplateSyncJob:
  enabled: true
  packConfigMap: wl-persona-pack
  # extraArgs:
  #   - --dry-run

whitelabelBranding:
  platformSettingsConfigMap: wl-platform-settings
  platformSettingsMountPath: /branding/platform-settings.json
  assetsConfigMap: wl-branding-assets
  assetsMountPath: /static/branding

ingress:
  hosts:
    - host: hub.example.com
      # paths: chart-specific

# Optional finops-staff (release chart — default disabled; auto-act/closed-loop off unless overridden)
# finopsStaff:
#   enabled: false
#   policyMode: readonly
#   # autoActDisabled: true      # chart default → FINOPS_STAFF_AUTO_ACT_DISABLED=true
#   # closedLoopEnabled: false   # chart default → FINOPS_STAFF_CLOSED_LOOP_ENABLED=false
#   # slackWebhookUrl: ""        # empty = no outbound Slack

# Create ConfigMaps from this repo before first deploy — see deploy/helm/README.md
