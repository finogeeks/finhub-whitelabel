# Example Prometheus scrape fragment (Option A — reuse your existing Prometheus).
# Adjust DNS names / ports to match your release compose or Kubernetes Services.
# Canonical dogfood copy ships in the vendor release at deploy/compose/prometheus-dogfood.yml.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/finops-alert-rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['<your-alertmanager-host>:9093']

scrape_configs:
  - job_name: finhub-ai-infra-rs-platform
    metrics_path: /metrics
    static_configs:
      - targets: ['<platform-claw-host>:26450']
        labels:
          runtime_adapter: finclaw
          stack: compose
  - job_name: finhub-timescaledb-exporter
    static_configs:
      - targets: ['<postgres-exporter-host>:9187']
        labels:
          db_role: convstore
  - job_name: finhub-redis-exporter
    static_configs:
      - targets: ['<redis-exporter-host>:9121']
